server:
  port: 8082

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${USERS_DB_URL:jdbc:postgresql://localhost:5433/users}
    username: ${USERS_DB_USER:users}
    password: ${USERS_DB_PASSWORD:users}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (db/migration)

app:
  # Shared secret the Keycloak SPI sends as X-Internal-Token on /internal/**.
  internal-token: ${USER_SERVICE_INTERNAL_TOKEN:}
  # Creates alice/alice (user) and bob/bob (user, admin) if the table is empty.
  seed-demo-users: ${SEED_DEMO_USERS:true}
  # Set true behind HTTPS so the refresh-token cookie is Secure.
  cookie-secure: ${COOKIE_SECURE:false}
  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:8080/auth}
    realm: ${KEYCLOAK_REALM:demo}
    client-id: ${USER_SERVICE_CLIENT_ID:user-service}
    client-secret: ${USER_SERVICE_CLIENT_SECRET:}
    # Id of the "user-service" User Federation component in the realm. Keycloak ids
    # of federated users are "f:<this id>:<user UUID>".
    federation-component-id: ${KEYCLOAK_FEDERATION_COMPONENT_ID:8a6f0e2c-3d4b-4c5a-9e7f-1b2c3d4e5f60}

management:
  endpoints:
    web:
      exposure:
        include: health
