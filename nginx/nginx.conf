worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Resolve upstreams via Docker DNS at request time so containers can be
    # restarted independently of nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cache successful auth decisions briefly, keyed on token + required role.
    # Keeps the auth service off the hot path for bursts of requests.
    # Trade-off: a revoked/expired token may be accepted for up to 'valid' seconds.
    proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth_cache:10m max_size=50m inactive=1m;

    # Brute-force throttle for password logins and sign-ups (per client IP).
    # Keycloak's brute-force detection additionally locks accounts per user.
    limit_req_zone $binary_remote_addr zone=credentials:10m rate=10r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        # nginx listens on 80 but is published on another host port; emit
        # relative Location headers so redirects keep the client's host:port.
        absolute_redirect off;

        set $keycloak_upstream     http://keycloak:8080;
        set $auth_service_upstream http://auth-service:8081;
        set $backend_upstream      http://backend:8000;
        set $user_service_upstream http://user-service:8082;

        # ---------------------------------------------------------------
        # Keycloak (login pages, token endpoint, admin console)
        # ---------------------------------------------------------------
        location /auth/ {
            proxy_pass $keycloak_upstream;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $server_port;
            # Keycloak responses carry large cookies/headers.
            proxy_buffer_size       128k;
            proxy_buffers           4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Convenience: Keycloak lives under /auth, so /admin -> admin console.
        location ~ ^/admin/?$ {
            return 302 /auth/admin/;
        }

        # Never expose Keycloak's management/metrics endpoints publicly.
        location ~ ^/auth/(health|metrics) {
            return 404;
        }

        # ---------------------------------------------------------------
        # auth_request target (internal only)
        # ---------------------------------------------------------------
        # /_auth/        -> any valid token
        # /_auth/<role>  -> valid token that carries realm role <role>
        # (The role is passed via the path because a server-level "set" would be
        # re-evaluated inside the subrequest and clobber per-location values.)
        location ~ ^/_auth/(?<required_role>[A-Za-z0-9_-]*)$ {
            internal;
            proxy_pass $auth_service_upstream/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length  "";
            proxy_set_header Authorization   $http_authorization;
            proxy_set_header X-Required-Role $required_role;
            proxy_set_header X-Original-URI    $request_uri;
            proxy_set_header X-Original-Method $request_method;

            proxy_cache            auth_cache;
            proxy_cache_key        "$http_authorization|$required_role";
            proxy_cache_valid      200 10s;
            proxy_cache_valid      any 0;
            proxy_ignore_headers   Cache-Control Expires Set-Cookie Vary;
        }

        # ---------------------------------------------------------------
        # Protected API: any valid token
        # ---------------------------------------------------------------
        location /api/ {
            auth_request /_auth/;
            auth_request_set $auth_user_id    $upstream_http_x_user_id;
            auth_request_set $auth_user_name  $upstream_http_x_user_name;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;

            proxy_pass $backend_upstream;
            # Overwrite (never trust) any client-supplied identity headers.
            proxy_set_header X-User-Id    $auth_user_id;
            proxy_set_header X-User-Name  $auth_user_name;
            proxy_set_header X-User-Email $auth_user_email;
            proxy_set_header X-User-Roles $auth_user_roles;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
        }

        # ---------------------------------------------------------------
        # Protected API: requires realm role "admin"
        # ---------------------------------------------------------------
        location /api/admin/ {
            auth_request /_auth/admin;
            auth_request_set $auth_user_id    $upstream_http_x_user_id;
            auth_request_set $auth_user_name  $upstream_http_x_user_name;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;

            proxy_pass $backend_upstream;
            proxy_set_header X-User-Id    $auth_user_id;
            proxy_set_header X-User-Name  $auth_user_name;
            proxy_set_header X-User-Email $auth_user_email;
            proxy_set_header X-User-Roles $auth_user_roles;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
        }

        # ---------------------------------------------------------------
        # Public: no auth
        # ---------------------------------------------------------------
        location /public/ {
            proxy_pass $backend_upstream;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Strip identity headers so the backend can't be spoofed.
            proxy_set_header X-User-Id    "";
            proxy_set_header X-User-Name  "";
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Roles "";
        }

        # ---------------------------------------------------------------
        # User service: login / logout / account management
        # (/internal/** is deliberately not routed: Keycloak SPI only)
        # ---------------------------------------------------------------
        # Keycloak SPI API: never reachable from outside (also token-protected).
        location /internal/ {
            return 404;
        }

        # Public, rate limited: password login and registration.
        location ~ ^/users/(login|register)$ {
            limit_req zone=credentials burst=10 nodelay;
            limit_req_status 429;
            error_page 429 = @too_many_requests;

            proxy_pass $user_service_upstream;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id    "";
            proxy_set_header X-User-Name  "";
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Roles "";
        }

        # Public: act on the HttpOnly refresh-token cookie (no bearer token).
        location ~ ^/users/(refresh|logout)$ {
            proxy_pass $user_service_upstream;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id    "";
            proxy_set_header X-User-Name  "";
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Roles "";
        }

        # Own account (/users/me, /users/me/password, ...): valid token.
        location /users/ {
            auth_request /_auth/;
            auth_request_set $auth_user_id    $upstream_http_x_user_id;
            auth_request_set $auth_user_name  $upstream_http_x_user_name;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;

            proxy_pass $user_service_upstream;
            proxy_set_header X-User-Id    $auth_user_id;
            proxy_set_header X-User-Name  $auth_user_name;
            proxy_set_header X-User-Email $auth_user_email;
            proxy_set_header X-User-Roles $auth_user_roles;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
        }

        # User administration: token with realm role "admin".
        location /users/admin/ {
            auth_request /_auth/admin;
            auth_request_set $auth_user_id    $upstream_http_x_user_id;
            auth_request_set $auth_user_name  $upstream_http_x_user_name;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;

            proxy_pass $user_service_upstream;
            proxy_set_header X-User-Id    $auth_user_id;
            proxy_set_header X-User-Name  $auth_user_name;
            proxy_set_header X-User-Email $auth_user_email;
            proxy_set_header X-User-Roles $auth_user_roles;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
        }

        location @too_many_requests {
            default_type application/json;
            return 429 '{"error":"too_many_requests","message":"Too many attempts, please wait a minute"}';
        }

        location @unauthorized {
            # nginx copies WWW-Authenticate from the auth subrequest automatically.
            default_type application/json;
            return 401 '{"error":"unauthorized"}';
        }

        location @forbidden {
            default_type application/json;
            return 403 '{"error":"forbidden"}';
        }

        # ---------------------------------------------------------------
        # Frontend SPA (static files; logs in via /users/login)
        # ---------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            # Revalidate on every load so edits show up without hard refresh.
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            # Everything the SPA talks to (/users, /api) is same-origin.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }
    }
}
